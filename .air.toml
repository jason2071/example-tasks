root = "."
tmp_dir = "tmp"

[build]
  pre_cmd = ["lsof -ti :3000 | xargs kill -9 2>/dev/null || true"]
  cmd = "go build -o ./tmp/api ."
  bin = "./tmp/api"
  delay = 1000
  exclude_dir = ["tmp", "vendor", "migrations", "node_modules"]
  exclude_regex = ["_test\\.go$"]
  include_ext = ["go"]
  kill_delay = 500

[log]
  time = false

[misc]
  clean_on_exit = true
